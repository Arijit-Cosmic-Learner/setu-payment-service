# render.yaml
# -----------
# Render Blueprint - defines both the web service and database as code.
# Render reads this file from the repo root on every deploy.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: setu-payment-service
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: setu-payments-db
          property: connectionString
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: Setu Payment Service

databases:
  - name: setu-payments-db
    databaseName: setu_payments
    user: setu_user
    plan: free
